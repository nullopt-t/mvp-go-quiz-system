events {
    worker_connections 1024;
}

http {
    # Define log format to show upstream response time and which server answered
    log_format upstreamlog '[$time_local] $remote_addr -> $server_name to: $upstream_addr '
                           'status: $status (upstream_status: $upstream_status) '
                           'time: $request_time s (upstream_time: $upstream_response_time s) '
                           'request: "$request"';

    access_log /var/log/nginx/access.log upstreamlog;

    upstream quiz_backend {
        # Round-robin load balancing between replicas of the 'app' container
        # max_fails=1 and fail_timeout=10s marks an unresponsive container as down
        # so subsequent requests skip it immediately instead of repeatedly retrying it.
        server app:8080 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;

        # Add response header showing which container replica processed the request
        add_header X-Served-By $upstream_addr always;

        location / {
            proxy_pass http://quiz_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Fast Failover Tuning:
            # Drop the connection timeout from OS default (often ~3-30s) to 500ms
            proxy_connect_timeout 500ms;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;

            # Failover immediately on connection errors, timeouts, or 502/503/504 errors
            proxy_next_upstream error timeout http_502 http_503 http_504 invalid_header;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 3s;

            # WebSocket / SSE support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
