<!DOCTYPE html>
<html lang="{{ .I18n.Lang }}" dir="{{ .I18n.Dir }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ .Quiz.Title }} - {{ index .I18n.T "app_title" }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <div style="display: flex; align-items: center; gap: 0.6rem;">
      <span class="badge badge-primary">{{ index .I18n.T "level" }} {{ .Student.LevelID }} • {{ index .I18n.T "group" }} {{ .Student.GroupID }}</span>
      <span style="font-weight: 600;">{{ .Student.Name }}</span>
    </div>
    <div class="nav-user">
      <a href="{{ index .I18n.T "lang_switch_url" }}" class="btn btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.85rem; font-weight: 700;">
        {{ index .I18n.T "lang_switch" }}
      </a>
    </div>
  </nav>

  <div class="container">
    <!-- Quiz Header -->
    <div class="quiz-header">
      <div>
        <h2 style="font-size: 1.4rem;">{{ .Quiz.Title }}</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem;">
          {{ .Quiz.Description }}
        </p>
      </div>

      <!-- Real-time Countdown Timer -->
      <div class="timer-box" id="timer-display">
        <span id="countdown">--:--</span>
      </div>
    </div>

    <!-- Dynamic Question Swapping Container -->
    {{ template "question_card.html" . }}

    <!-- Auto Submit Fallback Form -->
    <form id="auto-submit-form" action="/quizzes/{{ .Quiz.ID.Hex }}/submit" method="POST" style="display:none;"></form>
  </div>

  <script>
    let remainingSeconds = {{ .RemainingSeconds }};
    const countdownEl = document.getElementById('countdown');

    function updateTimer() {
      if (remainingSeconds <= 0) {
        countdownEl.innerText = "00:00 - {{ index .I18n.T "status_expired" }}";
        alert("{{ index .I18n.T "time_expired_alert" }}");
        document.getElementById('auto-submit-form').submit();
        return;
      }

      const hrs = Math.floor(remainingSeconds / 3600);
      const mins = Math.floor((remainingSeconds % 3600) / 60);
      const secs = remainingSeconds % 60;
      if (hrs > 0) {
        countdownEl.innerText = `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      } else {
        countdownEl.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      remainingSeconds--;
    }

    updateTimer();
    const timerInterval = setInterval(updateTimer, 1000);

    function highlightOption(element) {
      document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');

      const nextBtn = document.getElementById('next-btn');
      if (nextBtn) {
        nextBtn.disabled = false;
        nextBtn.style.opacity = '1';
        nextBtn.style.cursor = 'pointer';
      }
    }

    function submitFinalQuestion() {
      const form = document.getElementById('quiz-form');
      const radioChecked = form.querySelector('input[name="answer_id"]:checked');
      if (!radioChecked) {
        return;
      }
      document.getElementById('is_submit_field').value = "true";
      htmx.trigger(form, 'submit');
    }

    function navigateToQuestion(targetIndex) {
      const form = document.getElementById('quiz-form');
      if (!form) return;
      const targetField = document.getElementById('target_index_field');
      if (targetField) {
        targetField.value = targetIndex;
      }
      // If a choice is selected, submitting form auto-saves it before jumping
      htmx.trigger(form, 'submit');
    }

    // Sync browser URL to ?q=N after every HTMX question swap
    // This ensures page refresh always lands on the exact question being viewed
    document.addEventListener('htmx:afterSwap', function(evt) {
      const container = document.getElementById('question-container');
      if (!container) return;
      const idx = container.getAttribute('data-current-index');
      if (idx !== null) {
        const url = new URL(window.location.href);
        url.searchParams.set('q', idx);
        history.replaceState(null, '', url.toString());
      }
    });
  </script>
</body>
</html>
