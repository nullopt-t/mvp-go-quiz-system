<!DOCTYPE html>
<html lang="{{ .I18n.Lang }}" dir="{{ .I18n.Dir }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ index .I18n.T "admin_portal" }} - {{ index .I18n.T "admin_login_title" }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <nav class="navbar" style="justify-content: flex-end;">
    <div class="nav-user">
      <a href="{{ index .I18n.T "lang_switch_url" }}" class="btn btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.85rem; font-weight: 600;">
        {{ index .I18n.T "lang_switch" }}
      </a>
    </div>
  </nav>

  <div class="container" style="max-width: 440px; margin-top: 5rem;">
    <div class="card">
      <h2 style="margin-bottom: 0.5rem; text-align: center;">{{ index .I18n.T "admin_login_title" }}</h2>
      <p style="color: var(--text-muted); text-align: center; margin-bottom: 1.5rem; font-size: 0.9rem;">
        {{ index .I18n.T "admin_login_sub" }}
      </p>

      {{ if .Error }}
      <div class="alert alert-danger">
        {{ .Error }}
      </div>
      {{ end }}

      <form action="/admin/login" method="POST">
        <div class="form-group">
          <label for="pin">{{ index .I18n.T "admin_pin_label" }}</label>
          <input type="password" id="pin" name="pin" placeholder="••••••••" autofocus required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; margin-top: 1.25rem;">
          {{ index .I18n.T "admin_pin_btn" }}
        </button>
      </form>
    </div>
  </div>
</body>
</html>
