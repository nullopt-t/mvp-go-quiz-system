<!DOCTYPE html>
<html lang="{{ .I18n.Lang }}" dir="{{ .I18n.Dir }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ index .I18n.T "admin_portal" }} - {{ index .I18n.T "admin_login_title" }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body class="login-body">
  <header class="login-nav">
    <a href="{{ index .I18n.T "lang_switch_url" }}" class="btn-lang">
      {{ index .I18n.T "lang_switch" }}
    </a>
  </header>

  <main class="login-center-container">
    <div class="login-card">
      <h2 style="margin-bottom: 0.5rem; text-align: center; font-size: 1.65rem;">{{ index .I18n.T "admin_login_title" }}</h2>
      <p style="color: var(--text-muted); text-align: center; margin-bottom: 1.75rem; font-size: 0.95rem;">
        {{ index .I18n.T "admin_login_sub" }}
      </p>

      {{ if .Error }}
      <div class="alert alert-danger" style="margin-bottom: 1.25rem;">
        {{ .Error }}
      </div>
      {{ end }}

      <form action="/admin/login" method="POST">
        <div class="form-group">
          <label for="pin" style="font-size: 0.9rem; margin-bottom: 0.5rem;">{{ index .I18n.T "admin_pin_label" }}</label>
          <input type="password" id="pin" name="pin" placeholder="••••••••" style="padding: 0.85rem 1rem; font-size: 1rem;" autofocus required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.9rem; margin-top: 1.5rem; font-size: 1rem;">
          {{ index .I18n.T "admin_pin_btn" }}
        </button>
      </form>
    </div>
  </main>

  <script>
    if (window.location.search.includes('error=')) {
      const url = new URL(window.location);
      url.searchParams.delete('error');
      const cleanUrl = url.pathname + (url.searchParams.toString() ? '?' + url.searchParams.toString() : '');
      window.history.replaceState({}, document.title, cleanUrl);
    }
  </script>
</body>
</html>
