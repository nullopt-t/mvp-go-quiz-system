<!DOCTYPE html>
<html lang="{{ .I18n.Lang }}" dir="{{ .I18n.Dir }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ index .I18n.T "app_title" }} - {{ index .I18n.T "tab_student" }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="/login" class="nav-brand">
      🎓 <span>{{ index .I18n.T "app_title" }}</span>
    </a>
    <div class="nav-user">
      <span class="badge badge-primary">{{ index .I18n.T "nav_stateless" }}</span>
      <a href="{{ index .I18n.T "lang_switch_url" }}" class="btn btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.85rem; font-weight: 700;">
        🌐 {{ index .I18n.T "lang_switch" }}
      </a>
    </div>
  </nav>

  <div class="container" style="max-width: 480px; margin-top: 3.5rem;">
    <div class="card">
      <h2 style="margin-bottom: 0.5rem; text-align: center;">{{ index .I18n.T "welcome_back" }}</h2>
      <p style="color: var(--text-muted); text-align: center; margin-bottom: 1.5rem; font-size: 0.9rem;">
        {{ index .I18n.T "login_subtitle" }}
      </p>

      {{ if .Error }}
      <div class="alert alert-danger">
        ⚠️ {{ .Error }}
      </div>
      {{ end }}

      <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; background: #f1f5f9; padding: 0.25rem; border-radius: 8px;">
        <button id="btn-student" type="button" class="btn btn-primary btn-block" onclick="showTab('student')">{{ index .I18n.T "tab_student" }}</button>
        <button id="btn-admin" type="button" class="btn btn-secondary btn-block" onclick="showTab('admin')">{{ index .I18n.T "tab_admin" }}</button>
      </div>

      <!-- Student Login Form -->
      <form id="form-student" action="/login" method="POST">
        <input type="hidden" name="login_type" value="student">
        <div class="form-group">
          <label for="student_code">{{ index .I18n.T "student_id_label" }}</label>
          <input type="text" id="student_code" name="student_code" placeholder="e.g. L1G1-001 or L2G3-045" autofocus required>
          <small style="color: var(--text-muted); display: block; margin-top: 0.4rem; font-size: 0.8rem;">
            {{ index .I18n.T "student_id_hint" }}
          </small>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem;">{{ index .I18n.T "login_btn" }}</button>
      </form>

      <!-- Admin Login Form -->
      <form id="form-admin" action="/login" method="POST" style="display: none;">
        <input type="hidden" name="login_type" value="admin">
        <div class="form-group">
          <label for="pin">{{ index .I18n.T "admin_pin_label" }}</label>
          <input type="password" id="pin" name="pin" placeholder="Enter Admin PIN (default: admin123)">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem;">{{ index .I18n.T "admin_pin_btn" }}</button>
      </form>
    </div>

    <div style="text-align: center; font-size: 0.85rem; color: var(--text-muted);">
      {{ index .I18n.T "footer_info" }}
    </div>
  </div>

  <script>
    function showTab(type) {
      if (type === 'student') {
        document.getElementById('form-student').style.display = 'block';
        document.getElementById('form-admin').style.display = 'none';
        document.getElementById('btn-student').className = 'btn btn-primary btn-block';
        document.getElementById('btn-admin').className = 'btn btn-secondary btn-block';
      } else {
        document.getElementById('form-student').style.display = 'none';
        document.getElementById('form-admin').style.display = 'block';
        document.getElementById('btn-student').className = 'btn btn-secondary btn-block';
        document.getElementById('btn-admin').className = 'btn btn-primary btn-block';
      }
    }
  </script>
</body>
</html>
