<!DOCTYPE html>
<html lang="{{ .I18n.Lang }}" dir="{{ .I18n.Dir }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ index .I18n.T "app_title" }} - {{ index .I18n.T "welcome_back" }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="/login" class="nav-brand">
      <span>{{ index .I18n.T "app_title" }}</span>
    </a>
    <div class="nav-user">
      <a href="{{ index .I18n.T "lang_switch_url" }}" class="btn btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.85rem; font-weight: 600;">
        {{ index .I18n.T "lang_switch" }}
      </a>
    </div>
  </nav>

  <div class="container" style="max-width: 440px; margin-top: 5rem;">
    <div class="card">
      <h2 style="margin-bottom: 0.5rem; text-align: center;">{{ index .I18n.T "welcome_back" }}</h2>
      <p style="color: var(--text-muted); text-align: center; margin-bottom: 1.5rem; font-size: 0.9rem;">
        {{ index .I18n.T "login_subtitle" }}
      </p>

      {{ if .Error }}
      <div class="alert alert-danger">
        {{ .Error }}
      </div>
      {{ end }}

      <!-- Student Login Form -->
      <form action="/login" method="POST">
        <div class="form-group">
          <label for="student_code">{{ index .I18n.T "student_id_label" }}</label>
          <input type="text" id="student_code" name="student_code" placeholder="e.g. L1G1-001" autofocus required>
          <small style="color: var(--text-muted); display: block; margin-top: 0.4rem; font-size: 0.8rem;">
            {{ index .I18n.T "student_id_hint" }}
          </small>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; margin-top: 1.25rem;">{{ index .I18n.T "login_btn" }}</button>
      </form>
    </div>
  </div>
</body>
</html>
