<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Quiz System - Login</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="/login" class="nav-brand">
      🎓 <span>College Quiz System</span>
    </a>
    <span class="badge badge-primary">Stateless JWT Auth</span>
  </nav>

  <div class="container" style="max-width: 460px; margin-top: 4rem;">
    <div class="card">
      <h2 style="margin-bottom: 0.5rem; text-align: center;">Welcome Back</h2>
      <p style="color: var(--text-muted); text-align: center; margin-bottom: 1.5rem; font-size: 0.9rem;">
        Enter your Student ID to access your level and group quizzes
      </p>

      {{ if .Error }}
      <div class="alert alert-danger">
        ⚠️ {{ .Error }}
      </div>
      {{ end }}

      <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; background: #f1f5f9; padding: 0.25rem; border-radius: 8px;">
        <button id="btn-student" type="button" class="btn btn-primary btn-block" onclick="showTab('student')">Student ID</button>
        <button id="btn-admin" type="button" class="btn btn-secondary btn-block" onclick="showTab('admin')">Staff / Admin</button>
      </div>

      <!-- Student Login Form -->
      <form id="form-student" action="/login" method="POST">
        <input type="hidden" name="login_type" value="student">
        <div class="form-group">
          <label for="student_code">Student ID Code</label>
          <input type="text" id="student_code" name="student_code" placeholder="e.g. L1G1-001 or L2G3-045" autofocus required>
          <small style="color: var(--text-muted); display: block; margin-top: 0.4rem; font-size: 0.8rem;">
            Format: Level 1-5, Group 1-4 (e.g. <code>L1G1-001</code> to <code>L5G4-500</code>)
          </small>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem;">Log In & Access Quizzes</button>
      </form>

      <!-- Admin Login Form -->
      <form id="form-admin" action="/login" method="POST" style="display: none;">
        <input type="hidden" name="login_type" value="admin">
        <div class="form-group">
          <label for="pin">Staff Access PIN</label>
          <input type="password" id="pin" name="pin" placeholder="Enter Admin PIN (default: admin123)">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem;">Access Admin Portal</button>
      </form>
    </div>

    <div style="text-align: center; font-size: 0.85rem; color: var(--text-muted);">
      ⚡ Append-Only Quiz Engine • 5 Levels • 20 Groups • 10,000 Students
    </div>
  </div>

  <script>
    function showTab(type) {
      if (type === 'student') {
        document.getElementById('form-student').style.display = 'block';
        document.getElementById('form-admin').style.display = 'none';
        document.getElementById('btn-student').className = 'btn btn-primary btn-block';
        document.getElementById('btn-admin').className = 'btn btn-secondary btn-block';
      } else {
        document.getElementById('form-student').style.display = 'none';
        document.getElementById('form-admin').style.display = 'block';
        document.getElementById('btn-student').className = 'btn btn-secondary btn-block';
        document.getElementById('btn-admin').className = 'btn btn-primary btn-block';
      }
    }
  </script>
</body>
</html>
